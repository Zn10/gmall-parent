spring:
    application:
        name: server-gateway
    cloud:
        nacos:
            config:
                file-extension: yaml
                prefix: ${spring.application.name}-@spring.active@.yaml
                server-addr: gmall-nacos:8848
                timeout: 50000
                namespace: gmall
                refresh-enabled: true
                shared-configs:
                    - data-id: common.yaml
                      refresh: true
                    - data-id: ${spring.application.name}.yaml
                      refresh: true
            discovery:
                server-addr: gmall-nacos:8848
                namespace: gmall
    profiles:
        active: @spring.active@